<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
    http-equiv="refresh"
    content="4;url=/assinar/{{ token }}"
>

<title>

Abrindo Documento

</title>

<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#071b45;

    font-family:Arial;

    color:white;

}

.box{

    text-align:center;

}

.spinner{

    width:70px;

    height:70px;

    border:6px solid rgba(255,255,255,0.2);

    border-top:6px solid white;

    border-radius:50%;

    animation:girar 1s linear infinite;

    margin:auto;

    margin-bottom:25px;

}

@keyframes girar{

    100%{

        transform:rotate(360deg);

    }

}

h1{

    margin-bottom:10px;

}

</style>

</head>

<body>

<div class="box">

    <div class="spinner"></div>

    <h1>

        Abrindo documento...

    </h1>

    <p>

        Aguarde alguns segundos.

    </p>

</div>

</body>

</html>
