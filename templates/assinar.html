<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Assinatura Digital

    </title>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <style>

        body{

            font-family:Arial, Helvetica, sans-serif;

            background:#f5f7fb;

            margin:0;

            padding:40px;

        }

        .container{

            max-width:1000px;

            margin:auto;

            background:white;

            padding:30px;

            border-radius:20px;

            box-shadow:0 5px 20px rgba(0,0,0,0.08);

        }

        h1{

            margin-top:0;

            color:#111827;

        }

        .info{

            margin-bottom:25px;

            color:#374151;

        }

        iframe{

            width:100%;

            height:650px;

            border:none;

            border-radius:12px;

            background:#f9fafb;

        }

        .assinatura-box{

            margin-top:30px;

        }

        canvas{

            width:100%;

            max-width:600px;

            height:220px;

            border:2px dashed #d1d5db;

            border-radius:12px;

            background:white;

        }

        .buttons{

            display:flex;

            gap:12px;

            margin-top:20px;

        }

        button{

            border:none;

            padding:14px 24px;

            border-radius:12px;

            cursor:pointer;

            font-size:15px;

            font-weight:600;

        }

        .btn-clear{

            background:#e5e7eb;

        }

        .btn-save{

            background:#2563eb;

            color:white;

        }

        .success{

            text-align:center;

            padding:60px;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>

        Assinatura do Termo

    </h1>

    <div class="info">

        <strong>Colaborador:</strong>
        {{ notebook.colaborador }}

        <br><br>

        <strong>Equipamento:</strong>
        {{ notebook.notebook }}

        <br><br>

        <strong>Status:</strong>
        {{ notebook.status }}

    </div>

    <iframe
        src="/uploads/{{ notebook.termo }}"
    ></iframe>

    <div class="assinatura-box">

        <h3>

            Assine abaixo:

        </h3>

        <canvas id="signature-pad"></canvas>

        <form
            method="POST"
            id="formAssinatura"
        >

            <input
                type="hidden"
                name="assinatura"
                id="assinatura"
            >

            <div class="buttons">

                <button
                    type="button"
                    class="btn-clear"
                    onclick="limparAssinatura()"
                >

                    Limpar

                </button>

                <button
                    type="submit"
                    class="btn-save"
                >

                    Assinar Documento

                </button>

            </div>

        </form>

    </div>

</div>

<script>

    const canvas = document.getElementById(

        'signature-pad'

    );

    const signaturePad = new SignaturePad(

        canvas

    );

    function limparAssinatura(){

        signaturePad.clear();

    }

    document.getElementById(

        'formAssinatura'

    ).addEventListener(

        'submit',

        function(e){

            if(signaturePad.isEmpty()){

                alert(

                    'Faça sua assinatura antes de continuar.'

                );

                e.preventDefault();

                return;

            }

            document.getElementById(

                'assinatura'

            ).value = signaturePad.toDataURL();

        }

    );

</script>

</body>

</html>
